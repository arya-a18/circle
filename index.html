<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paru’s Circle</title>
<meta name="theme-color" content="#221C35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Circle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3FA; --surface:#FFFFFF; --ink:#221C35; --muted:#6B6580; --line:#E2DFEC;
  --pink:#D93A6E; --indigo:#4648D0; --amber:#B97500;
  --bubble-them:#FFFFFF; --wall-dot:#DAD6E8;
  --accent:var(--pink);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14121D; --surface:#1E1B2B; --ink:#EFECF7; --muted:#A39DB7; --line:#2E2A3F;
    --pink:#FF6B98; --indigo:#8E91FF; --amber:#F0B13A; --bubble-them:#25213A; --wall-dot:#262236;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14121D; --surface:#1E1B2B; --ink:#EFECF7; --muted:#A39DB7; --line:#2E2A3F;
  --pink:#FF6B98; --indigo:#8E91FF; --amber:#F0B13A; --bubble-them:#25213A; --wall-dot:#262236;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:760px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Home */
.home-top{padding:28px 22px 8px}
.home-top h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.95;letter-spacing:-.03em;margin:0}
.home-top p{margin:10px 0 0;color:var(--muted)}
.list{list-style:none;margin:18px 0 0;padding:0;overflow-y:auto;flex:1}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 22px;border-bottom:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.av{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:22px}
.av.sm{width:40px;height:40px;font-size:17px}
.av.xl{width:132px;height:132px;font-size:54px}
.av svg{width:55%;height:55%}
.av-friend{background:var(--pink)} .av-mentor{background:var(--indigo)} .av-debate{background:var(--amber)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.row-name time{font-weight:500;font-size:12px;color:var(--muted)}
.row-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-foot{padding:14px 22px 18px;color:var(--muted);font-size:13px}
.home-foot button{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:13px}

/* Chat */
.bar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 6px;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
.icon-btn{background:none;border:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--paper)}
.icon-btn svg{width:22px;height:22px}
.bar-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.bar-name{display:block;font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-status{display:block;font-size:12.5px;color:var(--muted)}
.bar-status.live{color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;background-color:var(--paper);background-image:radial-gradient(var(--wall-dot) 1px,transparent 1.2px);background-size:18px 18px}
.day{align-self:center;text-align:center;margin:8px auto;font-size:12px;color:var(--muted);background:var(--surface);border-radius:8px;padding:3px 10px;width:max-content}
.b{max-width:min(80%,520px);padding:8px 11px 6px;border-radius:14px;margin:3px 0;position:relative;word-wrap:break-word;white-space:normal;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.b .t{font-size:11px;color:var(--muted);float:right;margin:6px 0 -4px 10px}
.b.me{margin-left:auto;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-top-right-radius:4px}
.b.them{background:var(--bubble-them);border-top-left-radius:4px}
.b.sys{margin:10px auto;max-width:92%;background:var(--surface);border:1px dashed var(--line);font-size:14px;border-radius:10px}
.b .callmark{font-size:11px;color:var(--muted);margin-right:4px}
.fix{margin-top:6px;border-top:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding-top:5px;font-size:13.5px}
.fix div{margin:3px 0}
.fix s{color:var(--muted)}
.fix b{color:var(--accent)}
.fix i{color:var(--muted);font-style:normal;font-size:12.5px;display:block}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.compose{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 10px;background:var(--paper)}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit;max-height:140px;line-height:1.4}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px}
.send.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.send.rec{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
.note{font-size:13px;color:var(--muted);text-align:center;padding:4px 16px}

/* Debate topics */
.scroll{flex:1;overflow-y:auto;padding:0 0 24px}
.sec{padding:18px 18px 4px}
.sec h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sec p.lead{margin:0 0 10px;color:var(--muted);font-size:14px}
.news{border-top:1px solid var(--line);padding:14px 0}
.news .tag{font-size:12px;font-weight:700;color:var(--amber)}
.news h3{margin:2px 0 4px;font-size:16.5px;line-height:1.3}
.news p{margin:0 0 8px;font-size:14.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.motion{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}
.motion span{font-weight:600;font-size:15px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.hist{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px;align-items:center;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hist b{display:block;font-size:15px}
.hist small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Sheet */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--display);font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sheet h3{font-size:15px;margin:18px 0 6px}
.sheet ul{margin:0;padding-left:18px}
.sheet li{margin:3px 0;font-size:14.5px}
.sheet .muted{color:var(--muted);font-size:14px}
.score{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
label.lab{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}

/* Call */
.call{position:absolute;inset:0;z-index:30;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;padding:28px 20px 26px}
.call .who{font-family:var(--display);font-size:34px;font-weight:800;margin:18px 0 0;letter-spacing:-.02em}
.call .clock{opacity:.7;font-variant-numeric:tabular-nums}
.call .orb{margin-top:34px;position:relative;display:grid;place-items:center}
.call .orb::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:3px solid var(--accent);opacity:0;transform:scale(.9)}
.call.speaking .orb::before{animation:ring 1.3s ease-out infinite}
.call.listening .orb::before{opacity:.55;transform:scale(1)}
@keyframes ring{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.call .state{margin-top:30px;font-weight:600;font-size:15px;opacity:.85}
.call .caption{margin-top:10px;min-height:48px;max-width:520px;text-align:center;font-size:16px;opacity:.9}
.call .live{width:100%;max-width:520px;margin-top:10px;font-size:13.5px;flex:1;overflow-y:auto;opacity:.92}
.call .live .k{display:flex;gap:18px;justify-content:center;margin-bottom:8px}
.call .live .k b{font-size:20px;display:block;text-align:center;font-family:var(--display)}
.call .live .k span{font-size:12px;opacity:.7}
.call .live .c{border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent);padding:6px 0}
.call .typebox{display:flex;gap:8px;width:100%;max-width:520px;margin-top:10px}
.call .typebox input{flex:1;border-radius:22px;border:0;padding:12px 16px;font:inherit;background:color-mix(in srgb,var(--paper) 92%,transparent);color:var(--ink)}
.call .ctrls{display:flex;gap:26px;margin-top:16px}
.cbtn{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper)}
.cbtn svg{width:26px;height:26px}
.cbtn.end{background:#E0344B;color:#fff}
.cbtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.clabel{font-size:12px;text-align:center;margin-top:6px;opacity:.75}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <section class="view" id="home">
    <div class="home-top">
      <h1>Hey Paru</h1>
      <p id="homeDate"></p>
    </div>
    <ul class="list" id="homeList"></ul>
    <div class="home-foot" id="homeFoot"></div>
  </section>

  <!-- CHAT (friend / mentor / debate session) -->
  <section class="view" id="chat" hidden>
    <header class="bar">
      <button class="icon-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="bar-who" id="whoBtn">
        <span class="av sm" id="chatAv"></span>
        <span style="min-width:0"><span class="bar-name" id="chatName"></span><span class="bar-status" id="chatStatus">online</span></span>
      </button>
      <button class="pill" id="judgeBtn" hidden>Judge</button>
      <button class="icon-btn" id="callBtn" aria-label="Voice call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></button>
      <button class="icon-btn" id="moreBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="compose">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button class="send ghost" id="dictBtn" aria-label="Dictate" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
      <button class="send" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
    </div>
  </section>

  <!-- DEBATE HOME -->
  <section class="view" id="debateHome" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="av sm av-debate" id="dAv"></span>
      <span style="flex:1"><span class="bar-name">Debate Arena</span><span class="bar-status" id="newsStamp">current affairs</span></span>
      <button class="icon-btn" id="dMoreBtn" aria-label="Debate profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    </header>
    <div class="scroll">
      <div class="sec">
        <h2>Pick your own motion</h2>
        <textarea class="field" id="customMotion" rows="2" placeholder="e.g. This house believes India should ban phones in college classrooms"></textarea>
        <div class="acts" style="margin-top:8px"><button class="btn solid" id="customGo">Set up debate</button></div>
      </div>
      <div class="sec">
        <h2>What’s happening</h2>
        <p class="lead" id="newsLead"></p>
        <div class="acts" style="margin-bottom:6px"><button class="btn" id="refreshNews">Refresh news</button></div>
        <div id="newsList"></div>
      </div>
      <div class="sec">
        <h2>Hot motions</h2>
        <div id="motionList"></div>
      </div>
      <div class="sec">
        <h2>Your past debates</h2>
        <div id="histList"></div>
      </div>
    </div>
  </section>

  <div id="sheetHost"></div>
  <div id="callHost"></div>
</div>

<script>
(function(){
"use strict";

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\n/g,"<br>");
const uid = () => Math.random().toString(36).slice(2,10);
const hhmm = ts => new Date(ts).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
const nowLong = () => new Date().toLocaleString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
const stripEmoji = s => s.replace(/\p{Extended_Pictographic}|\u200d|\ufe0f/gu,"").replace(/[*_#`>]/g,"").replace(/\s+/g," ").trim();
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const ICONS = {
  friend: null,
  mentor: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M8 21h8"/></svg>',
  debate: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M4 7h16M7 7l-3 7a3 3 0 006 0zM17 7l-3 7a3 3 0 006 0z"/></svg>'
};
const MODES = {
  friend:{ name:"Ishradda", sub:"your bestie", accent:"--pink", av:"I" },
  mentor:{ name:"Mentor", sub:"speaking, grammar & confidence coach", accent:"--indigo" },
  debate:{ name:"Debate Arena", sub:"argue about what’s happening", accent:"--amber" }
};
function avHTML(mode, cls=""){ return `<span class="av ${cls} av-${mode}" aria-hidden="true">${ICONS[mode] || esc(MODES[mode].av)}</span>`; }


/* ---------- AI connection (your own API key) ---------- */
function parseJSON(t){
  const tryP = x=>{ try{ return JSON.parse(x); }catch(e){ return undefined; } };
  let v = tryP(t); if(v !== undefined) return v;
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ v = tryP(f[1]); if(v !== undefined) return v; }
  const a = Math.min(...["{","["].map(c=>{ const i = t.indexOf(c); return i < 0 ? Infinity : i; }));
  const b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if(a < b){ v = tryP(t.slice(a, b+1)); if(v !== undefined) return v; }
  throw { code:"invalid_json", text:t };
}
async function httpErr(res){
  let msg = ""; try{ const j = await res.json(); msg = (j.error && (j.error.message || j.error.type)) || JSON.stringify(j); }catch(e){}
  const m = (msg||"").toLowerCase();
  if(res.status === 429 || /quota|rate/.test(m)) return { code:"rate_limited", message:msg };
  if(/api key|api_key|authentication|x-api-key|permission/.test(m) || res.status === 401 || res.status === 403) return { code:"bad_key", message:msg };
  if(res.status === 404 || /not found|model/.test(m) && res.status === 400) return { code:"bad_model", message:msg };
  return { code:"upstream_error", message:msg || ("HTTP " + res.status) };
}
function makeAI(){
  async function gemini(c, system, turns, opts, quick, wantJson){
    const model = quick ? (c.gQuick || "gemini-3.5-flash-lite") : (c.gModel || "gemini-3.5-flash-lite");
    const body = { contents: turns.map(t=>({ role: t.role === "assistant" ? "model" : "user", parts:[{ text:t.content }] })), generationConfig:{ temperature: wantJson ? 0.4 : 0.9 } };
    if(system) body.systemInstruction = { parts:[{ text:system }] };
    if(opts.search) body.tools = [{ google_search:{} }];
    else if(wantJson) body.generationConfig.responseMimeType = "application/json";
    const stream = !!opts.onText;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:${stream ? "streamGenerateContent?alt=sse&" : "generateContent?"}key=${encodeURIComponent(c.key)}`;
    let res;
    try{ res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) }); }
    catch(e){ throw { code:"network" }; }
    if(!res.ok){
      const err = await httpErr(res);
      const sug = (err.message || "").match(/use (?:models\/)?(gemini-[\w.\-]+)/i);
      if(sug && sug[1] !== model && !opts._retried){
        S.settings.ai[quick ? "gQuick" : "gModel"] = sug[1]; ls.set("circle.settings", S.settings);
        return gemini(c, system, turns, { ...opts, _retried:true }, quick, wantJson);
      }
      throw err;
    }
    const pick = j => ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).filter(p=>!p.thought).map(p=>p.text || "").join("");
    if(!stream){ const j = await res.json(); const t = pick(j); if(!t) throw { code: j.promptFeedback ? "refused" : "empty_completion" }; return t; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", full = "";
    for(;;){
      const { done, value } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf("\n")) >= 0){

    const body = { model, max_tokens:1500, messages:turns };
    if(system) body.system = system;
    if(opts.search) body.tools = [{ type:"web_search_20250305", name:"web_search", max_uses:4 }];
    let res;
    try{ res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{ "content-type":"application/json", "x-api-key":c.key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" }, body:JSON.stringify(body) }); }
    catch(e){ throw { code:"network" }; }
    if(!res.ok) throw await httpErr(res);
    const j = await res.json();

    else { turns = input.slice(); if(turns.length > 1 && turns[0].role === "user") system = turns.shift().content; }

    if(!merged.length || merged[0].role !== "user") merged.unshift({ role:"user", content:"(start of conversation)" });
    if(merged[merged.length-1].role !== "user") merged.push({ role:"user", content:"(continue)" });
    if(wantJson) system += "\n\nRespond with only valid JSON and nothing else.";

  renderMsgs();
  S.busy = true;
  setStatus(mode === "friend" ? "typing…" : "thinking…", true);
  const tmp = addTemp('<span class="typing"><span></span><span></span><span></span></span>');
  let reply = "";
  try{
    if(mode === "mentor"){
      const input = [{ role:"user", content: mentorRules(spoken) }, ...history(msgs, 30)];
      const out = await S.sample.json(input, { cache:false, modelTier: spoken ? "quick" : "default" });
      reply = String(out && out.reply || "").trim() || "Say that once more for me.";
      const fixes = Array.isArray(out && out.corrections) ? out.corrections.filter(c=>c && c.said && c.better).slice(0,4) : [];
      if(fixes.length) userMsg.fix = fixes.map(c=>({said:String(c.said),better:String(c.better),why:String(c.why||"")}));
      tmp.remove();
      msgs.push({ id:uid(), r:"a", t:reply, ts:Date.now(), call:!!spoken });
      if(onSentence) onSentence(reply, true, userMsg.fix);
    } else {
      const sys = mode === "friend" ? friendRules(spoken) : debateRules(activeSession(), spoken);
      const input = [{ role:"user", content: sys }, ...history(msgs, mode === "friend" ? 40 : 24)];
      let spokenUpTo = 0;
      const res = await S.sample(input, {
        cache:false,
        modelTier: (mode === "friend" || spoken) ? "quick" : "default",
        search: mode === "debate",
        onText: ({ text: t }) => {
          tmp.innerHTML = md(t);
          $("msgs").scrollTop = $("msgs").scrollHeight;
          if(onSentence){
            const rest = t.slice(spokenUpTo);
            const mm = rest.match(/^[\s\S]*[.!?…](\s|$)|^[\s\S]*\n/);
            if(mm && mm[0].trim().length > 1){ onSentence(mm[0], false); spokenUpTo += mm[0].length; }
          }
        }
      });
      reply = res.text.trim();
      if(onSentence){ const rest = reply.slice(spokenUpTo); onSentence(rest, true); }
      tmp.remove();
      const parts = (mode === "friend" && !spoken) ? reply.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).slice(0,4) : [reply];
      parts.forEach((p,i)=> msgs.push({ id:uid(), r:"a", t:p, ts:Date.now()+i, call:!!spoken }));
    }
    if(mode === "debate"){ activeSession().ts = Date.now(); }
  }catch(e){
    tmp.remove();
    if(e && e.code === "cancelled"){ /* stopped by user */ }
    else msgs.push({ id:uid(), r:"s", t: errCopy(e), ts:Date.now() });
    if(onSentence) onSentence("", true);
  }finally{
    S.busy = false;
    setStatus(call ? "in a call" : defaultStatus(), !!call);
    renderMsgs();
    save(mode);
    if(mode !== "debate") maybeUpdateMemory(mode, false);
  }
  return reply;
}

/* ---------- long-term memory ---------- */
const memBusy = {};
async function maybeUpdateMemory(mode, force){
  if(!hasKey() || memBusy[mode]) return;
  const d = S.data[mode];
  const fresh = d.msgs.slice(d.memIdx || 0).filter(m=>m.r!=="s");
  if(!fresh.length || (!force && fresh.length < 10)) return;
  memBusy[mode] = true;
  const convo = fresh.map(m=>`${m.r==="u"?"Paru":(mode==="friend"?"Ishradda":"Mentor")}${m.call?" (voice)":""}: ${m.t}${m.fix?` [corrections: ${m.fix.map(f=>f.said+" -> "+f.better).join("; ")}]`:""}`).join("\n").slice(-60000);
  const prompt = mode === "friend"
    ? `You maintain the long-term memory of Ishradda, an AI best friend of Paru. Merge the existing memory with the new conversation.
Existing memory (JSON): ${JSON.stringify(d.memory)}
New conversation (${new Date().toDateString()}):
${convo}

Return ONLY JSON: {"summary": string (max 900 characters: the story of the friendship and what is going on in Paru's life lately), "facts": [up to 45 short strings: people in Paru's life and who they are, likes and dislikes, plans and deadlines with dates, ongoing situations, inside jokes, things Ishradda promised to ask about]}. Keep every still-relevant old fact; update ones that changed; drop trivial ones.`
    : `You maintain the coaching file of Mentor, Paru's communication coach. Merge the existing file with the new session and assess Paru honestly.
Existing file (JSON): ${JSON.stringify(d.memory)}
Recent voice-call stats: ${JSON.stringify((d.calls||[]).slice(-5))}
New session (${new Date().toDateString()}):
${convo}

Return ONLY JSON: {"summary": string (max 900 chars: level, progress so far, what was practised), "scores": {"grammar":1-10,"vocabulary":1-10,"fluency":1-10,"confidence":1-10,"structure":1-10}, "focus": [3 current focus areas], "plan": [next 3-5 concrete training steps], "mistakes": [up to 12 recurring error patterns with an example], "wins": [up to 8 genuine improvements], "facts": [up to 20 facts about Paru useful for coaching: goals, upcoming talks or interviews, interests]}. Base scores on evidence; move them gradually.`;
  try{
    const out = await S.sample.json(prompt, { cache:false, modelTier:"quick" });
    if(out && typeof out === "object"){
      d.memory = { ...d.memory, ...out };
      d.memIdx = d.msgs.length;
      save(mode);
    }
  }catch(e){ console.warn("memory update failed", e && e.code); }
  finally{ memBusy[mode] = false; }
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function enVoices(){ return (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v=>/^en/i.test(v.lang)); }
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{};
function pickVoice(mode){
  const vs = enVoices(); if(!vs.length) return null;
  const chosen = S.settings.voice[mode]; if(chosen){ const v = vs.find(v=>v.name===chosen); if(v) return v; }
  const fem = /female|samantha|zira|veena|neerja|heera|aria|jenny|sonia|libby|natural|google uk english female|google us english/i;
  const pref = mode === "friend"
    ? [v=>/en-IN/i.test(v.lang)&&fem.test(v.name), v=>/natural/i.test(v.name)&&fem.test(v.name), v=>/google/i.test(v.name)&&/en-(IN|US)/i.test(v.lang), v=>fem.test(v.name)]
    : [v=>/natural/i.test(v.name), v=>/google uk english male|daniel|ravi|prabhat|guy|ryan/i.test(v.name), v=>/google/i.test(v.name)];
  for(const f of pref){ const v = vs.find(f); if(v) return v; }
  return vs[0];
}
function makeUtter(text){
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(S.mode); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-IN";
  u.rate = S.settings.rate; u.pitch = S.settings.pitch[S.mode] ?? 1;
  return u;
}

function stopDictation(){ if(dict){ try{ dict.stop(); }catch(e){} dict = null; $("dictBtn").classList.remove("rec"); } }

    <div class="caption" id="cCap"></div>
    <div class="live" id="cLive"></div>
    <div class="typebox" id="cType" hidden><input id="cTypeIn" placeholder="Type or use your keyboard mic" aria-label="Say something"><button class="send" id="cTypeGo" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button></div>
    <div class="ctrls">
      <div><button class="cbtn" id="cMute" aria-pressed="false" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button><div class="clabel">Mute</div></div>
      <div><button class="cbtn" id="cCut" aria-label="Interrupt"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button><div class="clabel">Interrupt</div></div>
      <div><button class="cbtn end" id="cEnd" aria-label="End call"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 15c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-3a12 12 0 00-6 0v3L5.5 17.5z"/></svg></button><div class="clabel">End</div></div>
    </div></div>`;
  call.clock = setInterval(()=>{ const s2 = Math.floor((Date.now()-call.start)/1000); $("cClock").textContent = `${String(Math.floor(s2/60)).padStart(2,"0")}:${String(s2%60).padStart(2,"0")}`; }, 500);
  setStatus("in a call", true);
  $("cEnd").onclick = endCall;
  $("cCut").onclick = ()=>{ speechSynthesis.cancel(); };
  $("cMute").onclick = e=>{
    call.muted = !call.muted; e.currentTarget.setAttribute("aria-pressed", call.muted);
    if(call.muted){ stopRec(); setCallState("idle","Muted. Tap mute again to talk."); } else listen();
  };
  $("cTypeGo").onclick = ()=>{ const v = $("cTypeIn").value.trim(); if(v){ $("cTypeIn").value = ""; utterance(v, 0); } };
  $("cTypeIn").onkeydown = e=>{ if(e.key === "Enter") $("cTypeGo").click(); };
  renderLive();
  if(!SR) fallbackType("Live listening needs Chrome or Edge. Type (or use your keyboard mic) and I’ll talk back.");
  // greet within the tap gesture so the browser lets audio play
  const greet = mode === "friend" ? "heyyy Paru! okay I'm here, what's up?"
    : mode === "mentor" ? "Hello Paru. Stand up straight, shoulders back, and let's talk. Go ahead."
    : s.kind === "explain" ? "Hi Paru. What would you like to know about this story?"
    : "Alright Paru, the floor is yours. Give me your opening argument.";
  const sp = speaker(); sp.say(greet); sp.finish(()=> listen());
}
function setCallState(st, label){
  if(!call) return;
  call.state = st;
  const ui = $("callUI"); if(!ui) return;
  ui.classList.toggle("speaking", st === "speaking"); ui.classList.toggle("listening", st === "listening");
  $("cState").textContent = label || { listening:"Listening…", thinking:"Thinking…", speaking:"Speaking…", idle:"" }[st];
}
function fallbackType(msg){
  if(!call) return;
  call.noMic = true; $("cType").hidden = false; $("cCap").textContent = msg;
}
function renderLive(){
  const el = $("cLive"); if(!el || !call) return;
  let h = "";
  if(call.mode === "mentor"){
    const mins = call.speakMs / 60000;
    const wpm = mins > 0.05 ? Math.round(call.words / mins) : "–";
    const fpm = mins > 0.05 ? (call.fillers / mins).toFixed(1) : "–";
    h += `<div class="k"><div><b>${wpm}</b><span>words / min</span></div><div><b>${call.fillers}</b><span>fillers</span></div><div><b>${fpm}</b><span>fillers / min</span></div></div>`;
    h += call.fixes.slice(-4).reverse().map(f=>`<div class="c"><s>${esc(f.said)}</s> → <b>${esc(f.better)}</b></div>`).join("");
  }
  el.innerHTML = h;
}
function stopRec(){ if(call && call.rec){ try{ call.rec.onend = null; call.rec.abort(); }catch(e){} call.rec = null; } }
function listen(){
  if(!call || call.ended || call.muted || call.noMic) return;
  if(!SR){ fallbackType("Live listening needs Chrome or Edge. Type and I’ll talk back."); return; }
  stopRec();
  const rec = new SR(); call.rec = rec;
  rec.lang = "en-IN"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  call.finalText = ""; call.t0 = 0;
  setCallState("listening");
  rec.onspeechstart = ()=>{ call && (call.t0 = Date.now()); };
  rec.onresult = e=>{
    if(!call) return;
    if(!call.t0) call.t0 = Date.now();
    let fin = "", interim = "";
    for(let i=0;i<e.results.length;i++){ const r = e.results[i]; if(r.isFinal) fin += r[0].transcript; else interim += r[0].transcript; }
    call.finalText = fin;
    $("cCap").textContent = (fin + " " + interim).trim();
  };
  rec.onerror = e=>{
    if(!call) return;
    if(e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){
      stopRec(); fallbackType("The microphone is blocked here. Type below (or use your keyboard’s mic button) and I’ll still talk back. To fix the mic, allow microphone access for this page in your browser.");
    } else if(e.error !== "no-speech" && e.error !== "aborted"){ call.errs++; }
  };
  rec.onend = ()=>{
    if(!call || call.ended || call.rec !== rec) return;
    call.rec = null;
    const t = (call.finalText || "").trim();
    if(t){ call.errs = 0; utterance(t, call.t0 ? Date.now() - call.t0 : 0); }
    else if(call.errs > 4){ fallbackType("I’m having trouble hearing you. Type below and I’ll talk back."); }
    else if(!call.muted && call.state === "listening") setTimeout(listen, 250);
  };
  try{ rec.start(); }catch(e){ setTimeout(listen, 400); }
}
function speaker(){
  let pending = 0, finished = false, cb = null, fired = false;
  const check = ()=>{ if(finished && pending <= 0 && !fired){ fired = true; cb && cb(); } };
  return {
    say(t){
      const clean = stripEmoji(t || ""); if(!clean || !call || call.ended) return;
      pending++; setCallState("speaking");
      const u = makeUtter(clean);
      u.onend = u.onerror = ()=>{ pending--; check(); };
      speechSynthesis.speak(u);
    },
    finish(fn){ finished = true; cb = fn; check(); }
  };
}
async function utterance(text, durMs){
  if(!call || S.busy) return;
  stopRec();
  const words = text.split(/\s+/).filter(Boolean).length;
  call.words += words; call.speakMs += durMs > 300 ? durMs : words * 420;
  call.fillers += (text.match(FILLERS) || []).length;
  renderLive();
  $("cCap").textContent = text;
  setCallState("thinking");
  const sp = speaker();
  await turn(text, { spoken:true, onSentence:(chunk, done, fixes)=>{
    if(fixes){ call && (call.fixes = call.fixes.concat(fixes)); renderLive(); }
    if(chunk) { sp.say(chunk); if(call) $("cCap").textContent = stripEmoji(chunk); }
  }});
  sp.finish(()=>{ if(call && !call.ended){ $("cCap").textContent = ""; call.noMic ? setCallState("idle","Your turn") : listen(); } });
}
function endCall(){
  if(!call) return;
  const c = call; c.ended = true;
  stopRec(); speechSynthesis.cancel(); clearInterval(c.clock);
  const secs = Math.round((Date.now() - c.start)/1000);
  const mins = c.speakMs / 60000;
  const msgs = curMsgs();
  msgs.push({ id:uid(), r:"s", t:`📞 Voice call · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}${c.mode==="mentor"&&mins>0.05?` · ${Math.round(c.words/mins)} words/min · ${c.fillers} filler words`:""}`, ts:Date.now() });
  if(c.mode === "mentor" && c.words > 10){
    S.data.mentor.calls = (S.data.mentor.calls || []).concat([{ date:new Date().toLocaleDateString("en-IN"), mins:+(secs/60).toFixed(1), wpm: mins>0.05 ? Math.round(c.words/mins) : 0, fpm: mins>0.05 ? +(c.fillers/mins).toFixed(1) : 0 }]);
  }
  call = null;
  $("callHost").innerHTML = "";
  setStatus(defaultStatus());
  renderMsgs(); save(c.mode);
  if(c.mode !== "debate") maybeUpdateMemory(c.mode, true);
}

boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
